name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto
        run: |
          unzip -o *.zip -d project/
          ls project/
          ls project/JaviHotspot/

      - name: Instalar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Instalar SDK de Android necesario
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build APK
        working-directory: project/JaviHotspot
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoHotspot-debug
          path: project/JaviHotspot/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
