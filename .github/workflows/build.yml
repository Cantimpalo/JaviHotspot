name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Buscar y descomprimir ZIP
        run: |
          echo "Archivos en el repo:"
          ls -la
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP" -d extracted/
          echo "Contenido extraído:"
          ls extracted/

      - name: Make gradlew executable
        run: |
          find extracted/ -name "gradlew" -exec chmod +x {} \;

      - name: Build APK
        run: |
          GRADLEW=$(find extracted/ -name "gradlew" | head -1)
          PROJECTDIR=$(dirname "$GRADLEW")
          echo "Compilando en: $PROJECTDIR"
          cd "$PROJECTDIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoHotspot-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 30
