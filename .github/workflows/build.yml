name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas Android
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          sdkmanager --licenses < /dev/null || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Descomprimir proyecto
        run: unzip -o *.zip -d project/

      - name: Build APK
        working-directory: project/JaviHotspot
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoHotspot-debug
          path: project/JaviHotspot/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
