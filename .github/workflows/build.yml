name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas Android
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          sdkmanager --licenses < /dev/null || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Descomprimir y localizar proyecto
        run: |
          unzip -o *.zip -d project/
          echo "=== Estructura ==="
          find project/ -name "build.gradle" | head -5
          find project/ -name "settings.gradle" | head -5

      - name: Build APK
        run: |
          PROJDIR=$(find project/ -name "settings.gradle" | head -1 | xargs dirname)
          echo "Directorio: $PROJDIR"
          cd "$PROJDIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Buscar y subir APK
        run: |
          echo "APKs generados:"
          find project/ -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoHotspot-debug
          path: "project/**/*.apk"
          retention-days: 30
